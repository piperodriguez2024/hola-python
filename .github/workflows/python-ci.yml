name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

  sast:
    name: Analisis de seguridad SAST
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Bandit
        run: python -m pip install bandit

      - name: Analizar codigo Python
        run: bandit -r main.py tests

  dependency_audit:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Analizar dependencias
        run: python -m pip_audit
